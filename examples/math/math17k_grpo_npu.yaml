experiment_name: math17k-grpo
trial_name: trial0

seed: 1
enable_offload: false
total_train_epochs: 10
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 16
  fileroot: /tmp/areal/experiments
  name_resolve:
    type: ray


scheduler:
  type: ray

rollout:
  backend: "vllm:d2p1t4"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 32
  queue_size: null
  consumer_batch_size: 16
  max_head_offpolicyness: 2
  enable_rollout_tracing: false
  pause_grace_period: 5
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        VLLM_USE_V1: "1"
        VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
        TASK_QUEUE_ENABLE: "1"
        HCCL_EXEC_TIMEOUT: "14400"
        ACL_DEVICE_SYNC_TIMEOUT: "14400"
        HCCL_EVENT_TIMEOUT: "14500"
        HCCL_ASYNC_ERROR_HANDLING: "0"
        ACL_STREAM_TIMEOUT: "14500000"
        HCCL_CONNECT_TIMEOUT: "7200"
        PYTORCH_NPU_ALLOC_CONF: "expandable_segments:False"
        HCCL_NPU_SOCKET_PORT_RANGE: "62000-62350"
        TORCH_COMPILE_DISABLE: "0"
        OMP_PROC_BIND: "false"
        OMP_NUM_THREADS: "10"
        VLLM_ASCEND_ENABLE_FLASHCOMM1: "0"
        VLLM_ASCEND_ENABLE_FUSED_MC2: "0"
        VLLM_ASCEND_ENABLE_NZ: "0"
        VLLM_WORKER_MULTIPROC_METHOD: "spawn"
        AREAL_ALLOW_DEFAULT_ADMIN_KEY: "1"
        TMS_INIT_ENABLE: "0"
        VLLM_SERVER_DEV_MODE: "1"

  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  setup_timeout: 600
  request_timeout: 1200
  request_retries: 1
  agent:
    mode: inline
    export_style: individual
    turn_discount: 1.0

gconfig:
  n_samples: 8
  min_new_tokens: 0
  max_new_tokens: 14336
  greedy: false
  max_tokens: 32768
  temperature: 1.0

actor:
  backend: "megatron:d1p2t4"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3.6-27B
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 16384
  optimizer:
    type: adam
    lr: 1e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
  weight_update_mode: awex
  megatron:
    bridge_type: megatron-bridge
    enable_mtp: false
    freeze_vision_model: true
    freeze_vision_projection: true
  mindspeed:
    swap_optimizer: true
    use_fused_rotary_pos_emb: true
    use_fused_swiglu: true
    position_embedding_type: "rope"
  eps_clip: 0.2
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    level: token
    action: mask
    metric: ratio
    upper: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        VLLM_USE_V1: "1"
        VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
        TASK_QUEUE_ENABLE: "2"
        HCCL_EXEC_TIMEOUT: "14400"
        ACL_DEVICE_SYNC_TIMEOUT: "14400"
        HCCL_EVENT_TIMEOUT: "14500"
        HCCL_ASYNC_ERROR_HANDLING: "0"
        ACL_STREAM_TIMEOUT: "14500000"
        HCCL_CONNECT_TIMEOUT: "7200"
        PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
        HCCL_NPU_SOCKET_PORT_RANGE: "62360-62460"
        OMP_PROC_BIND: "false"
        OMP_NUM_THREADS: "10"
        VLLM_ASCEND_ENABLE_FLASHCOMM1: "0"
        VLLM_ASCEND_ENABLE_FUSED_MC2: "0"
        VLLM_ASCEND_ENABLE_NZ: "0"
        VLLM_WORKER_MULTIPROC_METHOD: "spawn"
        AREAL_ALLOW_DEFAULT_ADMIN_KEY: "1"
        TORCH_COMPILE_DISABLE: "1"
        TMS_INIT_ENABLE: "0"

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

awex:
  enable_colocate_mode: false
  device_backend: npu
  use_mindspeed: true
  comm_backend: hccl
  weights_exchange_ipc_backend: cpu
  enable_debug_mode: false
  meta_server_addr: auto
  weights_comm_nccl_group_size: 1
  weights_validation_steps: 0
  validate_weights_every_n_steps: 1

# SGLang
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.8

# vLLM
vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.7
  enforce_eager: false
  disable_sliding_window: false
  gdn_prefill_backend: triton
  additional_config:
    enable_cpu_binding: true
  compilation_config:
    cudagraph_mode: FULL_DECODE_ONLY

# datasets
train_dataset:
  batch_size: 16
  shuffle: true
  pin_memory: true
  num_workers: 4
  path: zhuzilin/dapo-math-17k
  type: rl
  max_length: 2048

valid_dataset:
  batch_size: 16
  pin_memory: true
  num_workers: 4
  path: zhuzilin/dapo-math-17k
  type: rl

# Utilities
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
