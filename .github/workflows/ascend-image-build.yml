name: Ascend NPU Nightly Images

on:
  push:
    branches:
      - ascend
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: false
        default: ascend
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: Git ref to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ascend-image-build-${{ github.repository }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-publish:
    name: build-and-publish-${{ matrix.accelerator }}-nightly
    if: github.repository == 'HwVanICI/AReaL'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        accelerator:
          - a2
          - a3

    env:
      ACCELERATOR: ${{ matrix.accelerator }}
      DOCKERFILE: Dockerfile.${{ matrix.accelerator }}
      IMAGE_CACHE: ghcr.io/hwvanici/areal_npu_buildcache:${{ matrix.accelerator }}
      IMAGE: ghcr.io/hwvanici/areal_npu:${{ matrix.accelerator }}-nightly

    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts

      - name: Preserve dependency reporter
        run: |
          mkdir -p "${RUNNER_TEMP}/image-dependencies"
          cp .github/scripts/image_dependencies.py "${RUNNER_TEMP}/image-dependencies/"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Record source revision
        id: source
        run: |
          source_sha=$(git rev-parse HEAD)
          echo "sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "Building source revision ${source_sha}"

      - name: Inspect runner and Docker access
        run: |
          set -euo pipefail

          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "Architecture: $(uname -m)"
          echo "Available CPUs: $(nproc)"
          free -h
          df -h /

          docker version
          docker buildx version
          docker system df

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Inventory previous nightly image
        id: previous
        continue-on-error: true
        timeout-minutes: 30
        run: |
          python3 "${RUNNER_TEMP}/image-dependencies/image_dependencies.py" snapshot \
            --image "${IMAGE}" \
            --output "${RUNNER_TEMP}/image-dependencies/previous.json"

      - name: Build and publish Dockerfile.${{ matrix.accelerator }}
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          docker buildx create \
            --driver docker-container \
            --name "areal-${ACCELERATOR}-builder" \
            --use
          docker buildx inspect --bootstrap

          SECONDS=0
          docker buildx build \
            --cache-from "type=registry,ref=${IMAGE_CACHE}" \
            --cache-to "type=registry,ref=${IMAGE_CACHE},mode=min" \
            --file "${DOCKERFILE}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --metadata-file "${RUNNER_TEMP}/image-dependencies/build.json" \
            --progress=plain \
            --push \
            --tag "${IMAGE}" \
            .
          echo "Build duration: ${SECONDS}s"

          docker buildx imagetools inspect "${IMAGE}"

      - name: Release local build cache
        run: docker buildx rm "areal-${ACCELERATOR}-builder"

      - name: Inventory published image and summarize changes
        id: dependencies
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/image-dependencies"
          digest=$(jq -er '."containerimage.digest"' "${report_dir}/build.json")
          python3 "${report_dir}/image_dependencies.py" snapshot \
            --image "${IMAGE%:*}@${digest}" \
            --output "${report_dir}/current.json"
          python3 "${report_dir}/image_dependencies.py" report \
            --previous "${report_dir}/previous.json" \
            --current "${report_dir}/current.json" \
            --output "${report_dir}/summary.md"
          cat "${report_dir}/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Report inventory failures
        if: always() && (steps.previous.outcome == 'failure' || steps.dependencies.outcome == 'failure')
        run: |
          echo '::warning::Dependency inventory is incomplete. See the inventory step logs.'
          echo 'Dependency inventory is incomplete. See the inventory step logs; a missing baseline may also mean this is the first build.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency inventories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-dependencies-${{ matrix.accelerator }}
          path: |
            ${{ runner.temp }}/image-dependencies/*.json
            ${{ runner.temp }}/image-dependencies/summary.md
          if-no-files-found: ignore

      - name: Report final storage usage
        if: always()
        run: |
          docker system df || true
          df -h / /var/lib/docker || true
