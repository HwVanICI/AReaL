name: CPU Unit Tests

on:
  pull_request:
    branches:
      - ascend-v1.0.5-ci-test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-unit-tests:
    name: cpu-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AREAL_IS_IN_CI: "1"
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HOME: "${{ github.workspace }}/.cache/huggingface"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      NO_PROXY: "127.0.0.1,localhost"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install CPU test environment
        run: uv sync --frozen --group dev

      - name: Verify CPU-only environment
        run: |
          uv run python - <<'PY'
          import torch

          print("torch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          assert not torch.cuda.is_available()
          PY

      - name: Pre-download slow-test artifacts
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
          HF_DATASETS_OFFLINE: "0"
        run: |
          set -euo pipefail

          uv run hf --version
          uv run hf download --help >/dev/null

          download_with_retry() {
            local attempt
            local delay

            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi

              if [[ "${attempt}" -lt 5 ]]; then
                delay=$((attempt * 30))
                echo "Download attempt ${attempt} failed; retrying in ${delay}s"
                sleep "${delay}"
              fi
            done

            echo "Download failed after 5 attempts"
            return 1
          }

          download_with_retry \
            uv run hf download \
            openai/gsm8k \
            --repo-type dataset \
            --max-workers 4

          download_with_retry \
            uv run hf download \
            hiyouga/geometry3k \
            --repo-type dataset \
            --max-workers 4

          # These tests construct tokenizers/processors but never load model
          # weights, so keep only the lightweight repository files.
          download_with_retry \
            uv run hf download \
            Qwen/Qwen3-0.6B \
            --exclude "*.safetensors" \
            --max-workers 4

          download_with_retry \
            uv run hf download \
            Qwen/Qwen2.5-VL-3B-Instruct \
            --exclude "*.safetensors" \
            --max-workers 4

      - name: Run CPU unit tests
        run: |
          uv run pytest -q \
            tests/test_adv_norm_config.py \
            tests/test_allocation_mode.py \
            tests/test_async_reward_wrapper.py \
            tests/test_async_task_runner.py \
            tests/test_attn_impl_validation.py \
            tests/test_awex_runtime.py \
            tests/test_clevr_reward.py \
            tests/test_code_agent.py \
            tests/test_dataset_mixture.py \
            tests/test_domain_router_workflow.py \
            tests/test_dpo.py \
            tests/test_dynamic_import.py \
            tests/test_eval_dispatch.py \
            tests/test_functional.py \
            tests/test_geometry3k_sft_dataset.py \
            tests/test_math_verify_reward.py \
            tests/test_mopd_loss.py \
            tests/test_perf_trace_converter.py \
            tests/test_ppo_stats.py \
            tests/test_prox_approx.py \
            tests/test_rejection_sampling.py \
            tests/test_requires_padded_seq.py \
            tests/test_seqpack.py \
            tests/test_split_trajectory_for_dump.py \
            tests/test_staleness_manager.py \
            tests/test_teacher_domain_routing.py \
            tests/test_utils.py \
            tests/test_vllm_generation_request.py \
            tests/test_vllm_pp_mismatch.py \
            tests/test_workflow_detection.py

      - name: Run qualified slow CPU tests
        run: |
          uv run pytest -q -m slow \
            tests/infra/data_service/test_epoch_crossing.py \
            tests/infra/data_service/test_data_service_e2e.py
